<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORIGIN 풀이 영상</title>
<style>
:root{--navy:#1F2D55;--pink:#F27D8E;--gold:#B08D57}
html,body{margin:0;background:#111;height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--navy)}
.wait{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(115deg,#CBF2EA,#B4DDF7 48%,#CDCDF5)}
.box{background:#fff;border-radius:20px;padding:32px 28px;margin:16px;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(31,45,85,.12)}
.logo{font-weight:800;letter-spacing:.12em;font-size:22px}.logo span{color:var(--pink)}
.id{display:inline-block;margin-top:14px;font-size:13px;background:#EEF6FD;border-radius:8px;padding:3px 10px}
p{color:#66738F;line-height:1.6;font-size:15px}
.player{display:none;flex-direction:column;align-items:center;min-height:100vh;background:#111}
.player video{width:100%;max-width:540px;max-height:100vh;background:#000;display:block}
.bar{width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;box-sizing:border-box;color:#D9C3A0;font-size:13px;letter-spacing:.08em}
.bar b{color:#F2EEE4;letter-spacing:0;font-size:14px}
</style></head><body>
<div class="wait" id="wait"><div class="box"><div class="logo"><span>O</span>RIGIN</div>
<div class="id" id="id"></div><p id="msg">영상을 찾는 중…</p></div></div>
<div class="player" id="player"><video id="vid" controls playsinline preload="auto"></video>
<div class="bar"><span>ORIGIN</span><b id="cap"></b></div></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'';
document.getElementById('id').textContent=v||'ID 없음';
fetch('videos.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{
  const u=m[v];
  if(!u){document.getElementById('msg').innerHTML='이 문제의 풀이 영상은 아직 준비 중이에요.<br>곧 올라와요!';return;}
  if(/\.mp4(\?|$)/.test(u)){   // 이 사이트에 올린 영상은 바로 재생
    document.getElementById('wait').style.display='none';
    const p=document.getElementById('player'),vd=document.getElementById('vid');p.style.display='flex';
    document.getElementById('cap').textContent=v.replace(/^c1-/,'').replace(/-1$/,' 대표 풀이');
    vd.src=u; vd.play().catch(()=>{});
  } else { location.replace(u); }   // 유튜브 등 바깥 주소
}).catch(()=>{document.getElementById('msg').textContent='잠시 후 다시 시도해 주세요.';});
</script></body></html>
