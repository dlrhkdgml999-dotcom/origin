<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORIGIN 풀이 영상</title>
<style>
:root{--navy:#1F2D55;--pink:#F27D8E;--gold:#B08D57}
html,body{margin:0;background:#111;height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--navy)}
.wait{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(115deg,#CBF2EA,#B4DDF7 48%,#CDCDF5)}
.box{background:#fff;border-radius:20px;padding:32px 28px;margin:16px;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(31,45,85,.12)}
.logo{font-weight:800;letter-spacing:.12em;font-size:22px}.logo span{color:var(--pink)}
.id{display:inline-block;margin-top:14px;font-size:13px;background:#EEF6FD;border-radius:8px;padding:3px 10px}
p{color:#66738F;line-height:1.6;font-size:15px}
.player{display:none;flex-direction:column;align-items:center;min-height:100vh;background:#111}
.player video{width:100vw;height:calc(100vh - 46px);height:calc(100dvh - 46px);object-fit:contain;background:#000;display:block}
body.land .player video{height:100vh;height:100dvh}
body.land .bar{position:fixed;top:0;right:0;width:auto;max-width:none;gap:14px;background:rgba(17,17,17,.72);border-bottom-left-radius:14px;transition:opacity .4s}
body.land .bar.hide{opacity:0;pointer-events:none}body.land .bar>span:first-child{display:none}
.bar{width:100%;max-width:none;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;box-sizing:border-box;color:#D9C3A0;font-size:13px;letter-spacing:.08em}
.bar b{color:#F2EEE4;letter-spacing:0;font-size:14px}
.ctl{display:flex;gap:8px}.ctl button{background:#2A2D35;color:#F2EEE4;border:1px solid #444;border-radius:16px;padding:6px 12px;font-size:14px;letter-spacing:0}
</style></head><body>
<div class="wait" id="wait"><div class="box"><div class="logo"><span>O</span>RIGIN</div>
<div class="id" id="id"></div><p id="msg">영상을 찾는 중…</p></div></div>
<div class="player" id="player"><video id="vid" controls playsinline preload="auto"></video>
<div class="bar"><span>ORIGIN</span><span class="ctl"><button id="back">⟲ 10초</button><button id="spd">1배속</button></span><b id="cap"></b></div></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'';
document.getElementById('id').textContent=v||'ID 없음';
fetch('videos.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{
  const u=m[v];
  if(!u){document.getElementById('msg').innerHTML='이 문제의 풀이 영상은 아직 준비 중이에요.<br>곧 올라와요!';return;}
  if(/\.mp4(\?|$)/.test(u)){   // 이 사이트에 올린 영상은 바로 재생 — 세로판(…mp4)·가로판(…_w.mp4), 폰 방향을 돌리면 보던 시간 그대로 바꿈
    document.getElementById('wait').style.display='none';
    const p=document.getElementById('player'),vd=document.getElementById('vid');p.style.display='flex';
    document.getElementById('cap').textContent=v.replace(/^c1-/,'').replace(/-1$/,' 대표 풀이');
    const wide=u.replace(/\.mp4/,'_w.mp4'); let hasWide=false;
    fetch(wide,{method:'HEAD'}).then(r=>{hasWide=r.ok;pick(true);}).catch(()=>pick(true));
    function land(){return window.innerWidth>window.innerHeight;}
    function pick(first){const want=(hasWide&&land())?wide:u; if(vd.dataset.src===want)return;
      const t=vd.currentTime||0, playing=!vd.paused; vd.dataset.src=want; vd.src=want; document.body.classList.toggle('land',want===wide);
      vd.addEventListener('loadedmetadata',()=>{ if(t) vd.currentTime=t; if(first||playing) vd.play().catch(()=>{}); },{once:true});}
    pick(true);
    const S=[1,1.25,1.5]; let si=0;
    document.getElementById('spd').onclick=()=>{si=(si+1)%S.length; vd.playbackRate=S[si]; document.getElementById('spd').textContent=S[si]+'배속';};
    vd.addEventListener('loadedmetadata',()=>{vd.playbackRate=S[si];});
    const bar=document.querySelector('.bar'); let ht=null; function showBar(){bar.classList.remove('hide');clearTimeout(ht);ht=setTimeout(()=>{if(document.body.classList.contains('land')&&!vd.paused)bar.classList.add('hide');},3000);}
    ['click','touchstart'].forEach(ev=>document.addEventListener(ev,showBar,{passive:true})); vd.addEventListener('play',showBar); vd.addEventListener('pause',()=>bar.classList.remove('hide'));
    document.getElementById('back').onclick=()=>{vd.currentTime=Math.max(0,vd.currentTime-10);};
    window.addEventListener('resize',()=>pick(false)); window.addEventListener('orientationchange',()=>setTimeout(()=>pick(false),300));
  } else { location.replace(u); }   // 유튜브 등 바깥 주소
}).catch(()=>{document.getElementById('msg').textContent='잠시 후 다시 시도해 주세요.';});
</script></body></html>
